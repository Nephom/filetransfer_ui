[package]
name = "fileapi-desktop"
version = "3.2.3+9d90f01"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.6.3" }

[dependencies]
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
rfd = "0.15.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.5" }
portable-pty = "0.9.0"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
