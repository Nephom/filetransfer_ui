[package]
name = "fileapi-desktop"
version = "3.0.5"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.6.3" }

[dependencies]
reqwest = { version = "=0.12.24", default-features = false, features = ["multipart", "rustls-tls"] }
rfd = "0.15.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.5" }
