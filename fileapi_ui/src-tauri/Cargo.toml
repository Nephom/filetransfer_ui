[package]
name = "nFterm"
version = "3.4.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "gzip", "multipart", "rustls-tls", "stream"] }
rfd = "0.15.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-drag = "2.1.1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "time", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots", "url"] }
rustls = { version = "0.23", features = ["ring"] }
futures-util = "0.3"
urlencoding = "2"
http = "1"
russh = { version = "0.62", features = ["des"] }
russh-sftp = "2.4"
keyring = "4"
dirs = "6"
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Shell"] }
