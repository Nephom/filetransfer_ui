[package]
name = "fileapi-desktop"
version = "3.3.0+20260808.305f522"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.6.3" }

[dependencies]
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
rfd = "0.15.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.5" }
tauri-plugin-drag = "2.1.1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "time"] }
russh = "0.62"
russh-sftp = "2.4"
keyring = "4"
dirs = "6"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Shell"] }
